[project]
name = "babu"
version = "0.2.0"
description = "A durable agent harness with CLI, Discord, and Notion plugins."
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "discord.py>=2.4,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
babu = "babu.main:main"

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
