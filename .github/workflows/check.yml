name: Babu application validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: babu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Babu behavior and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Babu source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Test Babu workflows and build packages
        run: nix flake check --no-update-lock-file --show-trace --print-build-logs
