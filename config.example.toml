[harness]
timezone = "Asia/Taipei"
max_model_calls = 6
max_tool_calls = 10
run_timeout_seconds = 180
tool_timeout_seconds = 30
# state_dir defaults to $XDG_STATE_HOME/babu or ~/.local/state/babu.
# instructions_path = "~/.config/babu/instructions.md"
# Convert reply sentences that contain Simplified-only characters: s2t, s2tw or s2hk.
# output_conversion = "s2tw"

[llm]
base_url = "http://127.0.0.1:8080/v1"
model = "Qwen3.6-35B-A3B"
temperature = 0.2
max_tokens = 4096
timeout_seconds = 60

# Enable only the plugins you need. Disabled plugins require no credentials.
[plugins.discord]
enabled = false
guild_id = 123456789
channel_id = 123456789
owner_user_ids = [123456789]

[plugins.notion]
enabled = false

[plugins.notion.default.tasks]
data_source_id = "replace-with-tasks-data-source-id"

[plugins.notion.default.finance]
data_source_id = "replace-with-finance-data-source-id"

# Override BOTH databases for a principal. Discord identities use discord:<user-id>;
# local CLI identities use local:<numeric-unix-uid>.
# [plugins.notion.users."discord:123456789".tasks]
# data_source_id = "private-tasks-data-source-id"
# [plugins.notion.users."discord:123456789".finance]
# data_source_id = "private-finance-data-source-id"
